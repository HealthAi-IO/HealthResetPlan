<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="健康重启计划 - 针对三高与肥胖人群的智能健康管理客户端">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="健康重启计划">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260623">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260623"/>
  <link rel="shortcut icon" href="favicon.ico?v=20260623"/>

  <title>健康重启计划</title>
  <link rel="manifest" href="manifest.json?v=20260623">
  <style>
    html, body {
      margin: 0;
      background: #f5f8ff;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #f5f8ff;
      transition: opacity 160ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-loading::before {
      width: 56px;
      height: 56px;
      content: "";
      border: 4px solid rgba(3, 169, 244, 0.16);
      border-top-color: #03a9f4;
      border-radius: 50%;
      animation: app-loading-spin 800ms linear infinite;
    }

    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="应用正在加载"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
