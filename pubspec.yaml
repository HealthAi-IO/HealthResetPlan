name: health_reset_plan
description: "健康重启计划 - 面向三高与体重管理人群的智能健康管理客户端"
publish_to: 'none'
version: 1.0.19+22

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 路由 / DI
  go_router: ^14.6.2
  get_it: ^8.0.3

  # 网络
  dio: ^5.7.0

  # 非业务偏好
  shared_preferences: ^2.3.3

  # Token 安全存储
  flutter_secure_storage: ^9.2.4

  # 本地通知
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.0

  # 系统闹钟集成（Android ACTION_SET_ALARM）
  android_intent_plus: ^5.1.0

  # 图片选择（相机 / 相册）
  image_picker: ^1.1.2
  file_picker: ^8.3.7

  # UI / 工具
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_widget_from_html_core: ^0.17.2
  logger: ^2.4.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  default-flavor: development
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/OFL.txt

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable-1.0.12.ttf
